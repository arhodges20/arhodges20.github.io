<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detection Rules | Aydan Hodges</title>
<meta name="description" content="Public library of Elastic Security detection rules, built and validated in a homelab.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Rules load from rules.ndjson in the same folder. Change the tokens here to match your site. */
:root{
  --bg:#f7f8fa; --panel:#fff; --fg:#151a23; --muted:#5a6577; --line:#dde2ea;
  --accent:#2453c9; --accent-soft:#e8eefc; --code-bg:#f0f2f6;
  --crit:#b42318; --high:#c2410c; --med:#a86a06; --low:#1b7f5a;
  --head:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f131a; --panel:#161b24; --fg:#e6eaf1; --muted:#9aa5b8; --line:#283141;
  --accent:#7ea2ff; --accent-soft:#1c2740; --code-bg:#1b212c;
  --crit:#f87171; --high:#fb923c; --med:#e6ad4d; --low:#4cc79a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:40px 20px 64px}
h1{font-family:var(--head);font-size:clamp(28px,5vw,38px);margin:0}
.sub{color:var(--muted);margin:6px 0 20px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar input{flex:1;min-width:200px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg)}
.bar input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.count{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.list{display:grid;gap:12px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.rule h2{font-family:var(--head);font-size:19px;margin:0;text-wrap:balance}
.sev{font-family:var(--mono);font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:3px;border:1px solid currentColor}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chip{font-family:var(--mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:3px;text-decoration:none}
.chip.plain{background:var(--code-bg);color:var(--muted)}
.desc{margin:0 0 12px;max-width:72ch}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.lbl{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button{font:500 12.5px var(--mono);background:none;border:1px solid var(--line);color:var(--fg);padding:4px 10px;border-radius:3px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0;font:13px/1.55 var(--mono)}
code{font-family:var(--mono);font-size:.9em;background:var(--code-bg);padding:1px 4px;border-radius:3px}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:14px}
.note{font-size:14px;margin-top:8px}
.note h4{font-size:14px;margin:12px 0 4px}
.note ol,.note ul{margin:0;padding-left:20px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.refs a{font-size:13.5px;color:var(--accent);margin-right:12px}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:4px}
</style>
</head>
<body>
<main class="wrap">
  <h1>Detection Rules</h1>
  <p class="sub">Elastic Security rules I've built and validated in my homelab. Each one can be imported directly into Kibana.</p>
  <div class="bar">
    <input id="q" type="search" placeholder="Search by name, technique or field" aria-label="Search rules">
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"><div class="empty">Loading rules…</div></div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dedent = s => { const l = String(s||"").split("\n"); const n = Math.min(...l.filter(x=>x.trim()).map(x=>x.match(/^ */)[0].length)); return l.map(x=>x.slice(n)).join("\n").trim(); };
const sevColor = {critical:"var(--crit)",high:"var(--high)",medium:"var(--med)",low:"var(--low)"};
const lang = r => ({kuery:"KQL",lucene:"Lucene",eql:"EQL",esql:"ES|QL"}[r.language] || r.language || "");
const type = r => ({query:"Custom query",eql:"Event correlation",threshold:"Threshold",new_terms:"New terms",esql:"ES|QL"}[r.type] || r.type);

function md(s){
  const inl = t => esc(t).replace(/`([^`]+)`/g,"<code>$1</code>");
  let out="", list=null;
  for (const line of String(s||"").split("\n")){
    const h=line.match(/^#{1,6}\s+(.*)/), o=line.match(/^\s*\d+\.\s+(.*)/), u=line.match(/^\s*[-*]\s+(.*)/);
    const want = o?"ol":u?"ul":null;
    if (list && list!==want){ out+=`</${list}>`; list=null; }
    if (h) out+=`<h4>${inl(h[1])}</h4>`;
    else if (want){ if(!list){ out+=`<${want}>`; list=want; } out+=`<li>${inl((o||u)[1])}</li>`; }
    else if (line.trim()) out+=`<p>${inl(line)}</p>`;
  }
  return out + (list?`</${list}>`:"");
}

function attack(r){
  const chips=[];
  for (const t of r.threat||[]){
    for (const te of t.technique||[]){
      const subs = te.subtechnique||[];
      if (subs.length) subs.forEach(s=>chips.push(`<a class="chip" href="${esc(s.reference)}" target="_blank" rel="noopener">${esc(s.id)} ${esc(s.name)}</a>`));
      else chips.push(`<a class="chip" href="${esc(te.reference)}" target="_blank" rel="noopener">${esc(te.id)} ${esc(te.name)}</a>`);
    }
    if (!(t.technique||[]).length && t.tactic) chips.push(`<span class="chip">${esc(t.tactic.id)} ${esc(t.tactic.name)}</span>`);
  }
  return chips.join("");
}

let rules=[];
function card(r,i){
  const tactics=[...new Set((r.threat||[]).map(t=>t.tactic?.name).filter(Boolean))];
  return `<article class="rule">
    <div class="top"><h2>${esc(r.name)}</h2><span class="sev" style="color:${sevColor[r.severity]||"var(--muted)"}">${esc(r.severity)}</span></div>
    <div class="chips">${attack(r)}${tactics.map(t=>`<span class="chip plain">${esc(t)}</span>`).join("")}<span class="chip plain">${esc(type(r))} · ${esc(lang(r))}</span>${(r.index||[]).map(x=>`<span class="chip plain">${esc(x)}</span>`).join("")}</div>
    <p class="desc">${esc(r.description)}</p>
    <div class="qhead"><span class="lbl">Query</span><button data-copy="${i}">Copy</button></div>
    <pre><code>${esc(dedent(r.query))}</code></pre>
    ${r.note?`<details><summary>Triage guide</summary><div class="note">${md(r.note)}</div></details>`:""}
    ${(r.references||[]).length?`<div class="refs" style="margin-top:10px">${r.references.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,""))}</a>`).join("")}</div>`:""}
    <div class="actions"><button data-dl="${i}">Download for Kibana import</button></div>
  </article>`;
}

function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const shown=rules.map((r,i)=>[r,i]).filter(([r])=>!q||JSON.stringify([r.name,r.description,r.query,r.threat,r.tags]).toLowerCase().includes(q));
  document.getElementById("count").textContent=`${shown.length} of ${rules.length} rule${rules.length===1?"":"s"}`;
  document.getElementById("list").innerHTML = shown.length ? shown.map(([r,i])=>card(r,i)).join("") : `<div class="empty">No rules match.</div>`;
}

document.addEventListener("click", async e=>{
  const c=e.target.closest("[data-copy]"), d=e.target.closest("[data-dl]");
  if (c){ const txt=dedent(rules[c.dataset.copy].query);
    try{ await navigator.clipboard.writeText(txt); c.textContent="Copied"; }catch{ c.textContent="Copy failed"; }
    setTimeout(()=>c.textContent="Copy",1500); }
  if (d){ const r=rules[d.dataset.dl];
    const blob=new Blob([JSON.stringify(r)+"\n"],{type:"application/x-ndjson"});
    const a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:r.name.toLowerCase().replace(/[^a-z0-9]+/g,"-")+".ndjson"});
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
});
document.getElementById("q").addEventListener("input",render);

fetch("rules.ndjson",{cache:"no-cache"})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(t=>{
    rules=t.split("\n").filter(l=>l.trim()).map(l=>JSON.parse(l)).filter(r=>r.rule_id)
           .sort((a,b)=>(b.updated_at||"").localeCompare(a.updated_at||""));
    render();
  })
  .catch(()=>{ document.getElementById("list").innerHTML=`<div class="empty">Couldn't load rules.ndjson. It needs to sit in the same folder as this page, served from the site (not opened as a local file).</div>`; });
</script>
</body>
</html>
